<!DOCTYPE html>
<html>
<head>
    <title>Pac-Man</title>
</head>
<style>
body {
  background-color: #0f172a;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  margin: 0;
  font-family: 'Press Start 2P', monospace;
  color: #ffffff;
  animation: fadeInBackground 2s ease forwards;
}
@keyframes fadeInBackground {
  from {
    background-color: #000000;
  }
  to {
    background-color: #0f172a;
  }
}
#game-board {
  background-color: #1a1a38;
  border: 6px solid #000000;
  margin-bottom: 25px;
  box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
  transition: transform 0.2s ease, box  -shadow 0.2s ease;
  border-radius: 12px;
}
#game-board:hover {
  box-shadow: 0 12px 24px rgba(0, 0, 0, 0.6);
}
#message-box {
  margin-top: 15px;
  font-size: 1.6em;
  color: #f5f5f5;
  text-shadow: 3px 3px 12px rgba(0, 0, 0, 0.7);
  animation: fadeIn 1s ease, pulse 2s infinite alternate;
}
@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes pulse {
  from {
    transform: scale(1);
  }
  to {
    transform: scale(1.08);
  }
}
.button-container {
  display: flex;
  gap: 20px;
  margin-top: 30px;
}
.game-button {
  background-color: #14b8a6;
  border: none;
  border-radius: 8px;
  color: white;
  font-size: 1.2rem;
  padding: 1rem 1.5rem;
  cursor: pointer;
  transition: background-color 0.2s ease, transform 0.2s ease;
}
.game-button:hover {
  background-color: #10b981;
  transform: scale(1.05);
}
</style>
<body>
    <canvas id="game-board" width="800" height="500"></canvas>
    <div id="scoreboard">Score: <span id="score-display">0</span></div>

    </div>
    <div id="message-box">Use arrow keys to move Pac-Man!</div>
    <div class="button-container">
      <button id="start-button" class="game-button">Start</button>
      <button id="sound-button" class="game-button">Sound On</button>
      <button id="back-button" class="game-button">Back</button>
    </div>


<script>
const canvas = document.getElementById('game-board');
const ctx = canvas.getContext('2d');
const messageBox = document.getElementById('message-box');
const startButton = document.getElementById('start-button');
const soundButton = document.getElementById('sound-button');
const backButton = document.getElementById('back-button');
const scoreDisplay = document.getElementById('score-display');
const scoreboard = document.getElementById('scoreboard');
const gridSize = 25;
const columns = canvas.width / gridSize;
const rows = canvas.height / gridSize;
const AudioContextClass = window.AudioContext || window.webkitAudioContext;
let food = { x: 1, y: 1 };
let pacman = { x: 10, y: 10 };
let redGhost = { x: 5, y: 5 };
let blueGhost = { x: 15, y: 5 };
let orangeGhost = { x: 20, y: 20 };
let pinkGhost = { x: 25, y: 25 };
let direction = 'right';
let nextDirection = 'right';
let gameSpeed = 125;
let gameRunning = false;
let gameHasEnded = false;
let gameInterval;
let score = 0;
let soundEnabled = true;
let audioContext;
const ghostColors = ['#ef4444', '#3b82f6', '#f97316', '#ec4899'];
const updateScoreDisplay = () => {
  scoreDisplay.textContent = score;
};
function drawPacman() {
  const facing = {
    right: 0,
    down: Math.PI / 2,
    left: Math.PI,
    up: -Math.PI / 2
  }[direction];

  const centerX = pacman.x * gridSize + gridSize / 2;
  const centerY = pacman.y * gridSize + gridSize / 2;

  ctx.fillStyle = '#facc15';
  ctx.beginPath();
  ctx.arc(centerX, centerY, gridSize / 2,
    facing + 0.25 * Math.PI,
    facing + 1.75 * Math.PI
  );
  ctx.lineTo(centerX, centerY);
  ctx.fill();
}
function drawGhost(ghost, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(ghost.x * gridSize + gridSize / 2, ghost.y * gridSize + gridSize / 2, gridSize / 2, Math.PI, 0);
  ctx.lineTo(ghost.x * gridSize + gridSize, ghost.y * gridSize + gridSize);
  ctx.lineTo(ghost.x * gridSize, ghost.y * gridSize + gridSize);
  ctx.closePath();
  ctx.fill();
}

function drawGame() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#f8fafc';
  ctx.beginPath();
  ctx.arc(food.x * gridSize + gridSize / 2, food.y * gridSize + gridSize / 2, gridSize / 5, 0, Math.PI * 2);
  ctx.fill();
  drawPacman();
  [redGhost, blueGhost, orangeGhost, pinkGhost].forEach((ghost, index) => {
    drawGhost(ghost, ghostColors[index]);
  });
}

function playTone(frequency, duration = 0.12) {
  if (!soundEnabled || !AudioContextClass) return;

  audioContext ??= new AudioContextClass();
  if (audioContext.state === 'suspended') audioContext.resume();

  const oscillator = audioContext.createOscillator();
  const volume = audioContext.createGain();
  const now = audioContext.currentTime;
  oscillator.frequency.value = frequency;
  volume.gain.setValueAtTime(0.12, now);
  volume.gain.exponentialRampToValueAtTime(0.001, now + duration);
  oscillator.connect(volume);
  volume.connect(audioContext.destination);
  oscillator.start(now);
  oscillator.stop(now + duration);
}

function playEatSound() {
  playTone(1047);
}
function playGameOverSound() {
  [65, 82, 98, 117].forEach((frequency) => playTone(frequency, 0.5));
}

function resetGame() {
  clearInterval(gameInterval);
  pacman = { x: 10, y: 10 };
  redGhost = { x: 5, y: 5 };
  blueGhost = { x: 15, y: 5 };
  orangeGhost = { x: 20, y: 15 };
  pinkGhost = { x: 25, y: 15 };
  direction = 'right';
  nextDirection = 'right';
  score = 0;
  gameRunning = false;
  gameHasEnded = false;
  updateScoreDisplay();
  placeFood();
  drawGame();
}

function placeFood() {
  do {
    food = {
      x: Math.floor(Math.random() * columns),
      y: Math.floor(Math.random() * rows)
    };
  } while ([pacman, redGhost, blueGhost, orangeGhost, pinkGhost].some(
    (entity) => entity.x === food.x && entity.y === food.y
  ));
}

function endGame(message) {
  gameRunning = false;
  gameHasEnded = true;
  clearInterval(gameInterval);
  messageBox.textContent = message;
  playGameOverSound();
}

function moveGhost(ghost) {
  const moves = [
    { x: 0, y: -1 },
    { x: 0, y: 1 },
    { x: -1, y: 0 },
    { x: 1, y: 0 }
  ];
  const move = moves[Math.floor(Math.random() * moves.length)];
  ghost.x = Math.max(0, Math.min(columns - 1, ghost.x + move.x));
  ghost.y = Math.max(0, Math.min(rows - 1, ghost.y + move.y));
}

function updateGame() {
  direction = nextDirection;
  if (direction === 'up') pacman.y--;
  if (direction === 'down') pacman.y++;
  if (direction === 'left') pacman.x--;
  if (direction === 'right') pacman.x++;

  if (pacman.x < 0 || pacman.x >= columns || pacman.y < 0 || pacman.y >= rows) {
    endGame('Game over! Press Start to try again.');
    return;
  }

  [redGhost, blueGhost, orangeGhost, pinkGhost].forEach(moveGhost);
  const ghosts = [redGhost, blueGhost, orangeGhost, pinkGhost];
  if (ghosts.some((ghost) => ghost.x === pacman.x && ghost.y === pacman.y)) {
    drawGame();
    endGame('Caught by a ghost! Press Start to try again.');
    return;
  }

  if (pacman.x === food.x && pacman.y === food.y) {
    score += 10;
    updateScoreDisplay();
    placeFood();
    playEatSound();
  }

  drawGame();
}

function startGame() {
  if (gameRunning) return;
  if (gameHasEnded) resetGame();
  gameRunning = true;
  messageBox.textContent = 'Use arrow keys to move Pac-Man!';
  gameInterval = window.setInterval(updateGame, gameSpeed);
}

document.addEventListener('keydown', (event) => {
  if (event.code === 'Space') {
    event.preventDefault();
    startGame();
    return;
  }

  if (!gameRunning) return;

  const directions = {
    ArrowUp: ['up', 'down', 784],
    ArrowDown: ['down', 'up', 698],
    ArrowLeft: ['left', 'right', 587],
    ArrowRight: ['right', 'left', 523]
  };
  const requestedDirection = directions[event.key];
  if (!requestedDirection) return;
  event.preventDefault();

  const [newDirection, oppositeDirection, frequency] = requestedDirection;
  if (nextDirection !== oppositeDirection) {
    nextDirection = newDirection;
    playTone(frequency);
  }
});
startButton.addEventListener('click', startGame);
soundButton.addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  soundButton.textContent = soundEnabled ? "Sound On" : "Sound Off";
});
backButton.addEventListener('click', () => {
  window.location.href = 'index.html';
});

resetGame();
</script>  
</body>
</html>
