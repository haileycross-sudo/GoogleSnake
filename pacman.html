<!DOCTYPE html>
<html>
<head>
    <title>Pac-Man</title>
</head>
<style>
body {
  background-color: #0f172a;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  margin: 0;
  font-family: 'Press Start 2P', monospace;
  color: #ffffff;
  animation: fadeInBackground 2s ease forwards;
}
@keyframes fadeInBackground {
  from {
    background-color: #000000;
  }
  to {
    background-color: #0f172a;
  }
}
#game-board {
  background-color: #6ee7b7;
  border: 6px solid #14b8a6;
  margin-bottom: 25px;
  box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
  transition: transform 0.2s ease, box  -shadow 0.2s ease;
  border-radius: 12px;
}
#game-board:hover {
  transform: scale(1.06);
  box-shadow: 0 12px 24px rgba(0, 0, 0, 0.6);
}
#message-box {
  margin-top: 15px;
  font-size: 1.6em;
  color: #f5f5f5;
  text-shadow: 3px 3px 12px rgba(0, 0, 0, 0.7);
  animation: fadeIn 1s ease, pulse 2s infinite alternate;
}
@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes pulse {
  from {
    transform: scale(1);
  }
  to {
    transform: scale(1.08);
  }
}
.button-container {
  display: flex;
  gap: 20px;
  margin-top: 30px;
}
.game-button {
  background-color: #14b8a6;
  border: none;
  border-radius: 8px;
  color: white;
  font-size: 1.2rem;
  padding: 1rem 1.5rem;
  cursor: pointer;
  transition: background-color 0.2s ease, transform 0.2s ease;
}
.game-button:hover {
  background-color: #10b981;
  transform: scale(1.05);
}
</style>
<body>
    <h1>Pac-Man</h1>
    <div id="game-board">
        <!-- Game board content goes here -->
    </div>
    <div id="message-box">Use arrow keys to move Pac-Man!</div>
    <div class="button-container">
        <button class="game-button" onclick="startGame()">Start Game</button>
        <button class="game-button" onclick="resetGame()">Reset Game</button>
        <button class="game-button" onclick="soundToggle()">Toggle Sound</button>
        <button class="game-button" onclick="backToMenu()">Back to Menu</button>
    </div>


<script>
    function startGame() {
        // Logic to start the Pac-Man game
        document.getElementById('message-box').textContent = "Game Started! Eat all the dots!";
    }
    function resetGame() {
        // Logic to reset the Pac-Man game
        document.getElementById('message-box').textContent = "Game Reset! Use arrow keys to move Pac-Man!";
    }   
    function updateGame() {
        // Logic to update the game state, such as moving Pac-Man and ghosts
    } 
</script>  
</body>
</html>
