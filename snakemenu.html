<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Menu</title>
  <style>
    body {
      align-items: center;
      background: #0f172a;
      color: white;
      display: flex;
      font-family: Arial, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
    }

    main {
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 2rem;
    }

    .games {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }

.game-link {
  position: relative;
  display: inline-block;
  text-decoration: none;
}
    
.game-link::after {
  content: attr(data-hover);
  position: absolute;
  left: 50%;
  top: calc(100% + 8px);
  transform: translateX(-50%);
  font-size: 0.75rem;
  opacity: 0;
  transition: opacity 0.2s ease;
  white-space: nowrap;
  color: white;
}

.game-link:hover::after {
  opacity: 1;
}

    a {
      background: #14b8a6;
      border-radius: 8px;
      color: white;
      display: block;
      font-size: 1.2rem;
      min-width: 160px;
      padding: 1rem 1.5rem;
      text-decoration: none;
    }

    a:hover {
      background: #0d9488;
    }
  </style>
</head>
<body>
  <main>
    <h1>Choose a Snake Game</h1>
        <nav class="games" aria-label="Games">
          <a href="snake.html" class="game-link" data-hover="Classic Snake">Normal Snake</a>
          <a href="snakeeasy.html" class="game-link" data-hover="Slower, Easier Gameplay. This is a Cake-Walk.">Easy Snake</a>
          <a href="snakehard.html" class="game-link" data-hover="Faster Movement, Less Points, and a Smaller Board. Good Luck!">Hard Snake</a>
        </nav>
      <!-- Add more games here, for example: <a href="tetris.html">Play Tetris</a> -->
    </nav>
  </main>
</body>
</html>
