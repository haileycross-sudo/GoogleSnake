<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Menu</title>
  <style>
    body {
      align-items: center;
      background: #0f172a;
      color: white;
      display: flex;
      font-family: Arial, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
    }

    main {
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 2rem;
    }

    .games {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }

    a {
      background: #14b8a6;
      border-radius: 8px;
      color: white;
      display: block;
      font-size: 1.2rem;
      min-width: 160px;
      padding: 1rem 1.5rem;
      text-decoration: none;
    }

    a:hover {
      background: #0d9488;
    }
  </style>
</head>
<body>
  <main>
    <h1>Choose a Snake Game</h1>
        <nav class="games" aria-label="Games">
